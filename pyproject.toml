[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-ai-agents"
version = "0.1.0"
description = "Production-grade Agentic RAG System over the AI Agents Guidebook using LlamaIndex + Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
  { name = "Soubhagya Jain" }
]
keywords = [
  "rag",
  "llama-index",
  "ollama",
  "gemma",
  "agentic-rag",
  "ai-agents",
  "production",
  "ragas"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # Core
  "pydantic>=2.8",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "loguru>=0.7",
  "rich>=13.0",
  "typer>=0.12",

  # LlamaIndex (primary framework)
  "llama-index>=0.12.0",
  "llama-index-llms-ollama>=0.3.0",
  "llama-index-embeddings-ollama>=0.3.0",
  "llama-index-vector-stores-chroma>=0.3.0",
  "llama-index-readers-file>=0.2.0",
  "llama-index-readers-unstructured>=0.2.0",
  "unstructured[pdf]>=0.14.0",

  # Local model support & utilities
  "ollama>=0.3.0",
  "tiktoken>=0.7",                    # token counting / chunk sizing

  # Evaluation (Ragas)
  "ragas>=0.1.10",

  # Optional but useful
  "numpy>=1.26",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
  # For future advanced evals / tracing
  # "llama-index-experimental",
]

[project.scripts]
rag = "app.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks/*", "data/*", ".venv/*", "__pycache__/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "Q", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["notebooks", "data", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
