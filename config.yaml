# =============================================================================
# Enterprise Agentic RAG System - Configuration
# LlamaIndex + Ollama (Gemma 4 8B)
# =============================================================================

project:
  name: "enterprise-rag-ai-agents"
  version: "0.1.0"
  description: "Production-grade RAG system over the AI Agents Guidebook using LlamaIndex + Gemma 4 8B"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  artifacts: "artifacts"
  logs: "logs"
  evaluation: "data/evaluation"

vector_store:
  persist_dir: "data/processed/chroma_db"
  collection_name: "ai_agents_guidebook"

document:
  primary_pdf: "ai_agents_guidebook.pdf"
  source_name: "AI Agents Guidebook"

# -----------------------------------------------------------------------------
# Ollama Configuration (Local)
# -----------------------------------------------------------------------------
ollama:
  base_url: "http://localhost:11434"
  timeout: 300

  # === Gemma 4 Latest ===
  llm_model: "gemma4:latest"
  llm_temperature: 0.1
  llm_max_tokens: 2048
  llm_num_ctx: 8192

  # Embeddings
  embed_model: "nomic-embed-text"
  embed_batch_size: 64

# -----------------------------------------------------------------------------
# LlamaIndex Settings
# -----------------------------------------------------------------------------
llama_index:
  chunk_size: 700                           # ← Increased from 400 (better semantic chunks)
  chunk_overlap: 100                        # ← Increased from 60
  similarity_top_k: 12                      # ← Increased from 10
  response_mode: "compact"

  vector_store:
    backend: "chroma"
    collection_name: "ai_agents_guidebook"
    persist_dir: "data/processed/chroma_db"

  include_metadata: true
  metadata_keys_to_include:
    - "page_label"
    - "file_name"
    - "source"
    - "section"
    - "has_code"
    - "has_diagram"
    - "content_type"
    - "parent_id"

# -----------------------------------------------------------------------------
# Ingestion
# -----------------------------------------------------------------------------
ingestion:
  loader: "llama_index"
  use_llama_parse: false
  extract_images: false
  extract_tables: true
  force_reingest: false
  min_chunks_threshold: 50

# -----------------------------------------------------------------------------
# Retrieval Strategies (Updated)
# -----------------------------------------------------------------------------
retrieval:
  # Default after diagnostics (plan recommends making both modes reliable, then let data decide).
  # Hybrid often wins for term-heavy technical PDFs once nodes are solid.
  mode: "hybrid"

  top_k: 12
  fetch_k: 30

  # Hybrid Search (Vector + BM25)
  hybrid_fusion_mode: "reciprocal_rerank"
  bm25_top_k: 15

  # Small-to-Big
  small_to_big_top_k: 20
  small_to_big_max_parents: 8

  use_reranker: false
  mmr_lambda: 0.5

  # Metadata-based score boosting to correct section bias (e.g. over-retrieval of "6. Memory")
  # This is applied via a NodePostprocessor after retrieval (in get_query_engine).
  metadata_boosting:
    enabled: true
    memory_section_penalty: 0.6      # Reduce score of nodes whose section contains "Memory"
    boost_important_sections: true   # Give modest boost to nodes from key sections (ReAct, Tool Use, etc.)

# -----------------------------------------------------------------------------
# Generation
# -----------------------------------------------------------------------------
generation:
  system_prompt_version: "v1"
  include_citations: true
  citation_format: "page"

# -----------------------------------------------------------------------------
# Evaluation Framework
# -----------------------------------------------------------------------------
evaluation:
  enabled: true
  dataset_path: "data/evaluation/eval_dataset.json"
  output_dir: "artifacts/evaluation_results"
  save_results: true
  num_questions: 18  # full current dataset; use 5 for smoke during heavy iteration
  
  retrieval_k: 10
  retrieval_metrics:
    - "recall_at_k"
    - "context_precision"
    - "page_hit_rate"
  
  ragas_metrics:
    - "faithfulness"
    - "answer_relevancy"
  custom_metrics:
    - "educational_quality"
  llm_for_judge: "gemma4:latest"
  embed_model_for_ragas: "nomic-embed-text"
  temperature: 0.0
  max_tokens: 1024
  batch_size: 4
  timeout: 300

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  json_logs: false
  log_to_file: true
  log_file: "logs/rag_system.log"
  rotation: "10 MB"
  retention: "30 days"