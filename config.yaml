# =============================================================================
# Enterprise Agentic RAG System - Configuration (LlamaIndex + Ollama)
# =============================================================================
# All settings are loaded via src/config.py into a strongly-typed Settings object.
# Never hardcode model names, paths, or retrieval parameters in source code.

project:
  name: "enterprise-rag-ai-agents"
  version: "0.1.0"
  description: "Production-grade Agentic RAG over the AI Agents Guidebook (LlamaIndex + local Gemma via Ollama)"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  vector_store: "data/vectorstore"
  artifacts: "artifacts"

document:
  primary_pdf: "ai_agents_guidebook.pdf"
  source_name: "AI Agents Guidebook"

# -----------------------------------------------------------------------------
# Ollama Configuration (Local models only)
# -----------------------------------------------------------------------------
ollama:
  base_url: "http://localhost:11434"   # Change if Ollama runs elsewhere
  timeout: 300                         # seconds for long generations

  # LLM: Gemma 4 Latest (update tag as new versions are released in Ollama)
  llm_model: "gemma2:27b"              # or "gemma2:9b", "gemma3", etc. Use what you have pulled
  llm_temperature: 0.1
  llm_max_tokens: 2048
  llm_request_timeout: 300

  # Embeddings - Local via Ollama
  embed_model: "nomic-embed-text"      # or "mxbai-embed-large", "snowflake-arctic-embed", etc.
  embed_batch_size: 50

  # Reranker (future Phase) - can be a cross-encoder via Ollama or sentence-transformers
  reranker_model: "bge-reranker-base"  # placeholder; will be used when we add reranking

# -----------------------------------------------------------------------------
# LlamaIndex Core Settings
# -----------------------------------------------------------------------------
llama_index:
  chunk_size: 1024
  chunk_overlap: 150
  similarity_top_k: 8
  response_mode: "compact"             # compact | tree_summarize | refine | etc.

  # Vector index settings
  vector_store:
    backend: "chroma"                  # chroma | faiss | simple (in-memory)
    collection_name: "ai_agents_guidebook"
    persist_dir: "data/vectorstore/chroma"

  # Node parsing / metadata
  include_metadata: true
  metadata_keys_to_include:
    - "page_label"
    - "file_name"
    - "source"

# -----------------------------------------------------------------------------
# Ingestion & Preprocessing
# -----------------------------------------------------------------------------
ingestion:
  loader: "llama_index"                # llama_index | pypdf | unstructured (future)
  use_llama_parse: false               # Set true if you have LlamaParse API key later
  extract_images: false
  extract_tables: false

# -----------------------------------------------------------------------------
# Retrieval & Generation
# -----------------------------------------------------------------------------
retrieval:
  top_k: 8
  fetch_k: 25                          # for MMR / over-retrieval before rerank
  use_hybrid_search: false             # enable in later phase with BM25 + vector
  use_reranker: false                  # enable after we integrate reranker

  # MMR diversity (when enabled)
  mmr_lambda: 0.5

generation:
  system_prompt_version: "v1_baseline"
  include_citations: true
  citation_format: "page"              # page | section | both

# -----------------------------------------------------------------------------
# Evaluation (Ragas)
# -----------------------------------------------------------------------------
evaluation:
  enabled: true
  ragas_metrics:
    - "faithfulness"
    - "answer_relevancy"
    - "context_precision"
    - "context_recall"
  llm_for_judge: "gemma2:27b"          # Can be same or stronger model
  embed_model_for_ragas: "nomic-embed-text"

# -----------------------------------------------------------------------------
# Logging & Observability
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  json_logs: false
  log_to_file: true
  log_file: "logs/rag_system.log"
  rotation: "10 MB"
  retention: "30 days"

# Environment-specific overrides example (future use)
# development:
#   logging.level: "DEBUG"
#   ollama.llm_temperature: 0.3
