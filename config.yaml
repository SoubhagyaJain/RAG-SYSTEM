# =============================================================================
# Enterprise Agentic RAG System - Configuration
# LlamaIndex + Ollama (Gemma 4 8B)
# =============================================================================

project:
  name: "enterprise-rag-ai-agents"
  version: "0.1.0"
  description: "Production-grade RAG system over the AI Agents Guidebook using LlamaIndex + Gemma 4 8B"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  artifacts: "artifacts"
  logs: "logs"

vector_store:
  persist_dir: "data/processed/chroma_db"
  collection_name: "ai_agents_guidebook"

document:
  primary_pdf: "ai_agents_guidebook.pdf"
  source_name: "AI Agents Guidebook"

# -----------------------------------------------------------------------------
# Ollama Configuration (Local)
# -----------------------------------------------------------------------------
ollama:
  base_url: "http://localhost:11434"
  timeout: 300

  # === Gemma 4 Latest 8B ===
  llm_model: "gemma4:8b"                    # ← Update if your Ollama tag is different
  llm_temperature: 0.1
  llm_max_tokens: 2048
  llm_num_ctx: 8192                         # Start with 8k, can increase later (up to 128k)

  # Embeddings
  embed_model: "nomic-embed-text"
  embed_batch_size: 64

  # Reranker (will be used in later phase)
  reranker_model: "bge-reranker-base"

# -----------------------------------------------------------------------------
# LlamaIndex Settings
# -----------------------------------------------------------------------------
llama_index:
  chunk_size: 768                           # Recommended for Gemma 4 8B
  chunk_overlap: 120
  similarity_top_k: 10
  response_mode: "compact"                  # compact | tree_summarize | refine

  vector_store:
    backend: "chroma"
    collection_name: "ai_agents_guidebook"
    persist_dir: "data/processed/chroma_db"

  # Rich metadata (very useful for this guidebook)
  include_metadata: true
  metadata_keys_to_include:
    - "page_label"
    - "file_name"
    - "source"
    - "section"
    - "has_code"
    - "has_diagram"

# -----------------------------------------------------------------------------
# Ingestion
# -----------------------------------------------------------------------------
ingestion:
  loader: "unstructured"                    # Best for illustrated/complex PDFs (headings, tables, code)
  use_llama_parse: false
  extract_images: false
  extract_tables: true
  force_reingest: false                     # Set true to overwrite existing Chroma collection
  min_chunks_threshold: 50                  # Used for idempotency check


# -----------------------------------------------------------------------------
# Retrieval
# -----------------------------------------------------------------------------
retrieval:
  top_k: 8
  fetch_k: 25
  use_hybrid_search: false                  # Enable in Phase 3+
  use_reranker: false                       # Enable after adding reranker
  mmr_lambda: 0.5

# -----------------------------------------------------------------------------
# Generation
# -----------------------------------------------------------------------------
generation:
  system_prompt_version: "v1"
  include_citations: true
  citation_format: "page"                   # page | section | both

# -----------------------------------------------------------------------------
# Evaluation (Ragas)
# -----------------------------------------------------------------------------
evaluation:
  enabled: true
  ragas_metrics:
    - "faithfulness"
    - "answer_relevancy"
    - "context_precision"
    - "context_recall"
  llm_for_judge: "gemma4:8b"                # Use same model or stronger
  embed_model_for_ragas: "nomic-embed-text"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  json_logs: false
  log_to_file: true
  log_file: "logs/rag_system.log"
  rotation: "10 MB"
  retention: "30 days"