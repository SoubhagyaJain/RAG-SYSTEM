# =============================================================================
# Enterprise Agentic RAG System - Configuration
# LlamaIndex + Ollama (Gemma 4 8B)
# =============================================================================

project:
  name: "enterprise-rag-ai-agents"
  version: "0.1.0"
  description: "Production-grade RAG system over the AI Agents Guidebook using LlamaIndex + Gemma 4 8B"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  artifacts: "artifacts"
  logs: "logs"
  evaluation: "data/evaluation"

vector_store:
  persist_dir: "data/processed/chroma_db"
  collection_name: "ai_agents_guidebook"

document:
  primary_pdf: "ai_agents_guidebook.pdf"
  source_name: "AI Agents Guidebook"

# -----------------------------------------------------------------------------
# Ollama Configuration (Local)
# -----------------------------------------------------------------------------
ollama:
  base_url: "http://localhost:11434"
  timeout: 300

  # === Gemma 4 Latest ===
  llm_model: "gemma4:latest"                # ← Update if your Ollama tag is different (user confirmed gemma4:latest)
  llm_temperature: 0.1
  llm_max_tokens: 2048
  llm_num_ctx: 8192                         # Start with 8k, can increase later (up to 128k)

  # Embeddings
  embed_model: "nomic-embed-text"
  embed_batch_size: 64

  # Reranker (will be used in later phase)
  reranker_model: "bge-reranker-base"

# -----------------------------------------------------------------------------
# LlamaIndex Settings
# -----------------------------------------------------------------------------
llama_index:
  chunk_size: 400                           # Characters (see length_function=len in pipeline). Conservative for local embed models to avoid context length errors on Ollama.
  chunk_overlap: 60
  similarity_top_k: 10
  response_mode: "compact"                  # compact | tree_summarize | refine

  vector_store:
    backend: "chroma"
    collection_name: "ai_agents_guidebook"
    persist_dir: "data/processed/chroma_db"

  # Rich metadata (very useful for this guidebook)
  include_metadata: true
  metadata_keys_to_include:
    - "page_label"
    - "file_name"
    - "source"
    - "section"
    - "has_code"
    - "has_diagram"

# -----------------------------------------------------------------------------
# Ingestion
# -----------------------------------------------------------------------------
ingestion:
  loader: "llama_index"                     # Current pipeline uses LlamaIndex SimpleDirectoryReader
  use_llama_parse: false
  extract_images: false
  extract_tables: true
  force_reingest: false                     # Set true to overwrite existing Chroma collection
  min_chunks_threshold: 50                  # Used for idempotency check


# -----------------------------------------------------------------------------
# Retrieval Strategies
# -----------------------------------------------------------------------------
retrieval:
  # Supported modes (see src/retrieval/retriever.py for implementations):
  # - "vector"       : Pure dense vector similarity (baseline)
  # - "small_to_big" : Retrieve small leaves, expand to real parent nodes from docstore (recommended)
  # - "hybrid"       : Vector + BM25 via QueryFusionRetriever (great for technical docs)
  mode: "small_to_big"

  top_k: 8                                  # Final number of contexts passed to the LLM
  fetch_k: 25                               # Over-fetch for MMR / fusion (if used)

  # Hybrid Search (Vector + BM25)
  hybrid_fusion_mode: "reciprocal_rerank"   # "simple" | "reciprocal_rerank"
  bm25_top_k: 10

  # Small-to-Big specific
  small_to_big_top_k: 15                    # Number of small leaves to retrieve before parent expansion
  small_to_big_max_parents: 6               # How many big parent contexts to keep

  # Future / advanced
  use_reranker: false
  mmr_lambda: 0.5

# -----------------------------------------------------------------------------
# Generation
# -----------------------------------------------------------------------------
generation:
  system_prompt_version: "v1"
  include_citations: true
  citation_format: "page"                   # page | section | both

# -----------------------------------------------------------------------------
# Evaluation Framework
# -----------------------------------------------------------------------------
evaluation:
  enabled: true
  dataset_path: "data/evaluation/eval_dataset.json"
  output_dir: "artifacts/evaluation_results"
  save_results: true
  num_questions: 20                         # Subset for quick iteration (full dataset has 40-50)
  
  # Retrieval evaluation
  retrieval_k: 10
  retrieval_metrics:
    - "recall_at_k"
    - "context_precision"
    - "page_hit_rate"
  
  # Generation evaluation (Ragas + custom)
  ragas_metrics:
    - "faithfulness"
    - "answer_relevancy"
  custom_metrics:
    - "educational_quality"                 # Custom LLM-as-judge for structure, depth, citations, clarity
  llm_for_judge: "gemma4:latest"            # Use latest model for judge
  embed_model_for_ragas: "nomic-embed-text"
  temperature: 0.0
  max_tokens: 1024
  batch_size: 4
  timeout: 300

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  json_logs: false
  log_to_file: true
  log_file: "logs/rag_system.log"
  rotation: "10 MB"
  retention: "30 days"
